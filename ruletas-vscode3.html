<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruletas de Clase</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a12;
    --panel: #13131f;
    --border: #1e1e32;
    --accent1: #ff6b35;
    --accent2: #7c3aed;
    --accent3: #06d6a0;
    --gold: #ffd60a;
    --text: #e8e8f0;
    --muted: #6b6b8a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 50%, rgba(124,58,237,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 80% 50%, rgba(255,107,53,0.08) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  header {
    text-align: center;
    padding: 2rem 1rem 1rem;
    position: relative; z-index: 1;
  }

  header h1 {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    letter-spacing: 0.12em;
    background: linear-gradient(135deg, var(--accent1) 0%, var(--gold) 50%, var(--accent3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  header p {
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.4rem;
  }

  .container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    max-width: 1300px;
    margin: 0 auto;
    padding: 1.5rem 2rem 3rem;
    position: relative; z-index: 1;
  }

  @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    position: relative;
    overflow: hidden;
  }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 20px 20px 0 0;
  }

  .panel-names::before { background: linear-gradient(90deg, var(--accent2), var(--accent1)); }
  .panel-qa::before    { background: linear-gradient(90deg, var(--accent3), var(--accent2)); }

  .panel-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.6rem;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .panel-names .panel-title { color: var(--accent1); }
  .panel-qa    .panel-title { color: var(--accent3); }

  /* ── WHEEL ── */
  .wheel-wrap {
    position: relative;
    width: 300px; height: 300px;
    flex-shrink: 0;
  }

  .wheel-wrap canvas {
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(124,58,237,0.35), 0 0 0 4px rgba(255,255,255,0.06);
    transition: box-shadow 0.3s;
  }

  .wheel-wrap.spinning canvas {
    box-shadow: 0 0 60px rgba(255,107,53,0.5), 0 0 0 4px rgba(255,107,53,0.3);
  }

  .pointer {
    position: absolute;
    top: 50%; right: -20px;
    transform: translateY(-50%);
    width: 0; height: 0;
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    border-right: 34px solid var(--gold);
    filter: drop-shadow(0 0 8px var(--gold));
    z-index: 10;
  }

  /* ── BUTTONS ── */
  .spin-btn {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.3rem;
    letter-spacing: 0.12em;
    padding: 0.7rem 2.5rem;
    border: none; border-radius: 50px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    position: relative; overflow: hidden;
  }

  .spin-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.15);
    opacity: 0; transition: opacity 0.2s;
  }

  .spin-btn:hover::after { opacity: 1; }
  .spin-btn:active { transform: scale(0.96); }
  .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .panel-names .spin-btn {
    background: linear-gradient(135deg, var(--accent2), var(--accent1));
    color: #fff;
    box-shadow: 0 4px 20px rgba(255,107,53,0.35);
  }

  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'Outfit', sans-serif;
    font-size: 0.78rem;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .reset-btn:hover { border-color: var(--accent1); color: var(--accent1); }

  /* ── RESULT BOX ── */
  .result-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.8rem 1.5rem;
    min-width: 260px;
    text-align: center;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .result-name {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.8rem;
    letter-spacing: 0.08em;
    color: var(--gold);
    animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  .result-placeholder {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  @keyframes popIn {
    0%  { transform: scale(0.4) rotate(-10deg); opacity: 0; }
    100%{ transform: scale(1)   rotate(0deg);   opacity: 1; }
  }

  /* ── USED LIST ── */
  .used-section {
    width: 100%;
  }

  .used-title {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.4rem;
  }

  .used-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .chip {
    font-size: 0.72rem;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    background: rgba(255,107,53,0.12);
    border: 1px solid rgba(255,107,53,0.25);
    color: var(--muted);
    text-decoration: line-through;
  }

  /* ── COUNTER BADGE ── */
  .counter-badge {
    font-family: 'Bebas Neue', cursive;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .counter-badge span { color: var(--accent1); }

  /* ── Q&A ── */
  .qa-card-wrap { width: 100%; perspective: 900px; }

  .qa-card {
    background: rgba(6,214,160,0.04);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 1.4rem 1.6rem;
    cursor: pointer;
    transition: transform 0.15s;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 0.7rem;
    user-select: none;
    background-image: linear-gradient(var(--panel), var(--panel)),
                      linear-gradient(135deg, var(--accent3), var(--accent2));
    background-origin: border-box;
    background-clip: padding-box, border-box;
  }

  .qa-card:hover { transform: scale(1.012); }
  .qa-card:active { transform: scale(0.98); }

  .qa-card.flip-anim {
    animation: cardFlip 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  @keyframes cardFlip {
    0%   { transform: rotateY(0deg); }
    50%  { transform: rotateY(90deg); }
    100% { transform: rotateY(0deg); }
  }

  .qa-state-label {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
  }

  .label-idle { background: rgba(124,58,237,0.25); color: var(--accent2); }
  .label-q    { background: rgba(6,214,160,0.2);  color: var(--accent3); }
  .label-a    { background: rgba(255,214,10,0.2); color: var(--gold); }
  .label-done { background: rgba(255,107,53,0.15); color: var(--accent1); }

  .qa-text {
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.55;
    color: var(--text);
  }

  .qa-number {
    font-family: 'Bebas Neue', cursive;
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .qa-hint {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    width: 100%;
  }

  .progress-bar-bg {
    flex: 1; height: 5px;
    background: var(--border);
    border-radius: 10px; overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent3), var(--accent2));
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  .progress-label {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
    min-width: 50px;
    text-align: right;
  }

  .reset-qa-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'Outfit', sans-serif;
    font-size: 0.78rem;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .reset-qa-btn:hover { border-color: var(--accent3); color: var(--accent3); }

  #confetti-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<header>
  <h1>🎡 Ruletas de Clase</h1>
  <p>Tómbola interactiva · Alumnos &amp; Preguntas</p>
</header>

<div class="container">

  <!-- ══ RULETA ALUMNOS ══ -->
  <div class="panel panel-names">
    <div class="panel-title">🎰 Ruleta de Alumnos</div>

    <div class="wheel-wrap" id="wheelWrap">
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
      <div class="pointer"></div>
    </div>

    <div class="result-box" id="nameResult">
      <span class="result-placeholder">Dale giro para seleccionar</span>
    </div>

    <div class="counter-badge" id="nameCounter">
      Disponibles: <span id="availCount">0</span> / <span id="totalCount">0</span>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinWheel()">🎲 GIRAR</button>
    <button class="reset-btn" onclick="resetWheel()">↺ Reiniciar ruleta</button>

    <div class="used-section" id="usedSection" style="display:none">
      <div class="used-title">Ya participaron</div>
      <div class="used-chips" id="usedChips"></div>
    </div>
  </div>

  <!-- ══ TÓMBOLA PREGUNTAS ══ -->
  <div class="panel panel-qa">
    <div class="panel-title">📋 Tómbola de Preguntas</div>

    <div class="progress-row">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
      <span class="progress-label" id="progressLabel">0 / 0</span>
    </div>

    <div class="qa-card-wrap">
      <div class="qa-card" id="qaCard" onclick="handleQaClick()">
        <span class="qa-state-label label-idle" id="qaLabel">Haz clic para comenzar</span>
        <div class="qa-text" id="qaText">Toca la tarjeta para obtener una pregunta aleatoria</div>
        <div class="qa-hint" id="qaHint"></div>
      </div>
    </div>

    <div class="qa-number" id="qaNumber"></div>
    <button class="reset-qa-btn" onclick="resetQa()">↺ Reiniciar preguntas</button>
  </div>

</div>

<script>

/* ═══════════════════════════════════════════════════════════
   ✏️  EDITA AQUÍ LOS NOMBRES
═══════════════════════════════════════════════════════════ */
const ALL_NAMES = [
  "Ana García",
  "Luis Martínez",
  "Sofia López",
  "Carlos Pérez",
  "María Torres",
  "Juan Rodríguez",
  "Valeria Díaz",
  "Miguel Sánchez",
  "Isabella Flores",
  "Andrés Morales",
  "Camila Jiménez",
  "Pablo Hernández",
  "Lucía Ramírez",
  "Diego Vargas",
];

/* ═══════════════════════════════════════════════════════════
   ✏️  EDITA AQUÍ LAS PREGUNTAS Y RESPUESTAS
═══════════════════════════════════════════════════════════ */
const ALL_QA = [
  { q: "¿Qué es la mecatrónica?",                     a: "Es la combinación de mecánica, electrónica, informática y control para diseñar sistemas inteligentes." },
  { q: "¿Qué es un microcontrolador?",                a: "Circuito integrado que contiene CPU, memoria y periféricos E/S en un solo chip." },
  { q: "¿Para qué sirve un PLC?",                     a: "Para automatizar procesos industriales mediante lógica programable." },
  { q: "¿Qué es un sensor?",                          a: "Dispositivo que detecta magnitudes físicas y las convierte en señales eléctricas." },
  { q: "¿Qué es un actuador?",                        a: "Elemento que convierte una señal de control en una acción física (movimiento, calor, etc.)." },
  { q: "¿Qué significa PWM?",                         a: "Pulse Width Modulation: modulación por ancho de pulso para controlar potencia." },
  { q: "¿Qué es el protocolo I2C?",                   a: "Protocolo de comunicación en serie de dos hilos (SDA y SCL) para conectar periféricos." },
  { q: "¿Qué es la ley de Ohm?",                      a: "V = I × R  (Voltaje = Corriente × Resistencia)." },
  { q: "¿Qué es un motor paso a paso?",               a: "Motor que se mueve en incrementos fijos (pasos) controlados por pulsos eléctricos." },
  { q: "¿Qué es el protocolo SPI?",                   a: "Interfaz serie síncrona de 4 hilos (MOSI, MISO, SCLK, CS) para alta velocidad." },
  { q: "¿Qué es la retroalimentación en control?",    a: "Uso de la salida del sistema para corregir y ajustar la entrada de control." },
  { q: "¿Qué es un controlador PID?",                 a: "Controlador Proporcional-Integral-Derivativo que minimiza el error del sistema." },
  { q: "¿Qué es un encoder rotativo?",                a: "Sensor que convierte posición o velocidad angular en señales digitales." },
  { q: "¿Qué es UART?",                               a: "Protocolo de comunicación serial asíncrona, usa TX y RX para transmitir datos." },
  { q: "¿Qué es el voltaje de referencia en un ADC?", a: "Tensión máxima con la que se compara la señal analógica para convertirla a digital." },
  { q: "¿Qué es un servomotor?",                      a: "Motor con control de posición precisa mediante señal PWM, generalmente 0–180°." },
  { q: "¿Qué significa IoT?",                         a: "Internet of Things: interconexión de dispositivos físicos a través de internet." },
  { q: "¿Qué es un transistor como interruptor?",     a: "Dispositivo semiconductor que permite o corta el flujo de corriente mediante una señal de control." },
  { q: "¿Qué es la frecuencia de muestreo?",          a: "Número de muestras por segundo tomadas de una señal analógica (teorema de Nyquist)." },
  { q: "¿Qué es un relé?",                            a: "Interruptor electromecánico controlado eléctricamente para manejar cargas de alta potencia." },
  { q: "¿Qué es el protocolo MQTT?",                  a: "Protocolo ligero de mensajería publicación/suscripción usado en IoT." },
  { q: "¿Qué es la impedancia?",                      a: "Oposición total al flujo de corriente alterna, combina resistencia y reactancia." },
  { q: "¿Qué es un sistema embebido?",                a: "Sistema computacional integrado en un producto para realizar tareas específicas." },
  { q: "¿Qué es la lógica de escalera (Ladder)?",     a: "Lenguaje de programación para PLCs que representa contactos y bobinas como circuitos." },
  { q: "¿Qué es un oscilador de cristal?",            a: "Componente que genera señal de reloj precisa usando la resonancia de un cristal de cuarzo." },
  { q: "¿Qué es la comunicación full-duplex?",        a: "Transmisión simultánea en ambas direcciones entre dos dispositivos." },
  { q: "¿Qué es un convertidor DC-DC?",               a: "Circuito que transforma un nivel de voltaje continuo a otro (elevador, reductor, inversor)." },
  { q: "¿Qué es la cinemática en robótica?",          a: "Estudio del movimiento del robot (posiciones, velocidades) sin considerar las fuerzas." },
];

/* ═══════════════════════════════════════════
   WHEEL STATE
═══════════════════════════════════════════ */
const PALETTE = [
  '#7c3aed','#a855f7','#5b21b6','#8b5cf6',
  '#ff6b35','#f97316','#c2410c','#ea580c',
  '#06d6a0','#10b981','#059669','#14b8a6',
  '#ffd60a','#facc15',
];

const canvas = document.getElementById('wheelCanvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const cx = W/2, cy = H/2;

let available    = [...ALL_NAMES]; // names still on the wheel
let usedNames    = [];             // names already picked
let currentAngle = 0;
let isSpinning   = false;

function R() { return W / 2 - 6; }

function drawWheel(angle) {
  const n   = available.length;
  ctx.clearRect(0, 0, W, H);

  if (n === 0) {
    // Empty wheel
    ctx.beginPath();
    ctx.arc(cx, cy, R(), 0, 2*Math.PI);
    ctx.fillStyle = '#1e1e32';
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = 'bold 14px Outfit';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('¡Todos participaron!', cx, cy);
    return;
  }

  const arc = (2 * Math.PI) / n;
  for (let i = 0; i < n; i++) {
    const start = angle + i * arc;
    const end   = start + arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R(), start, end);
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + arc / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    let fsize = Math.min(13, (R() * 0.7) / (available[i].length * 0.55));
    fsize = Math.max(7, fsize);
    ctx.font = `600 ${fsize}px Outfit`;
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur  = 3;
    ctx.fillText(available[i], R() - 10, fsize / 3);
    ctx.restore();
  }

  // Center cap
  ctx.beginPath();
  ctx.arc(cx, cy, 18, 0, 2*Math.PI);
  const grad = ctx.createRadialGradient(cx-4, cy-4, 2, cx, cy, 18);
  grad.addColorStop(0,'#fff');
  grad.addColorStop(1,'#ffd60a');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#0a0a12';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function updateNameCounter() {
  document.getElementById('availCount').textContent = available.length;
  document.getElementById('totalCount').textContent = ALL_NAMES.length;
}

function updateUsedChips() {
  const sec   = document.getElementById('usedSection');
  const chips = document.getElementById('usedChips');
  if (usedNames.length === 0) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  chips.innerHTML = usedNames.map(n => `<span class="chip">${n}</span>`).join('');
}

function spinWheel() {
  if (isSpinning || available.length === 0) return;
  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('wheelWrap').classList.add('spinning');

  const extraSpins = 6 + Math.floor(Math.random() * 5);
  const target     = currentAngle + extraSpins * 2 * Math.PI + Math.random() * 2 * Math.PI;
  const duration   = 4000 + Math.random() * 1500;
  const startTime  = performance.now();
  const startAngle = currentAngle;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const elapsed  = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    currentAngle   = startAngle + (target - startAngle) * easeOut(progress);
    drawWheel(currentAngle);
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = target % (2 * Math.PI);
      isSpinning   = false;
      document.getElementById('wheelWrap').classList.remove('spinning');
      pickWinner();
    }
  }
  requestAnimationFrame(animate);
}

function pickWinner() {
  const n   = available.length;
  const arc = (2 * Math.PI) / n;
  let norm  = ((Math.PI - currentAngle) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
  const idx = Math.floor(norm / arc) % n;
  const winner = available[idx];

  // Show result
  document.getElementById('nameResult').innerHTML =
    `<span class="result-name">🏆 ${winner}</span>`;

  // Remove from wheel
  available.splice(idx, 1);
  usedNames.push(winner);

  // Recalculate angle so wheel looks consistent after removal
  currentAngle = currentAngle % (2 * Math.PI);

  // Update UI
  updateNameCounter();
  updateUsedChips();
  drawWheel(currentAngle);
  launchConfetti();

  // Re-enable or disable spin button
  if (available.length === 0) {
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('nameResult').innerHTML =
      `<span class="result-name" style="font-size:1.1rem">🎉 ¡Todos participaron!</span>`;
  } else {
    document.getElementById('spinBtn').disabled = false;
  }
}

function resetWheel() {
  available    = [...ALL_NAMES];
  usedNames    = [];
  currentAngle = 0;
  isSpinning   = false;
  document.getElementById('spinBtn').disabled = false;
  document.getElementById('nameResult').innerHTML =
    `<span class="result-placeholder">Dale giro para seleccionar</span>`;
  updateNameCounter();
  updateUsedChips();
  drawWheel(0);
}

// Init
updateNameCounter();
updateUsedChips();
drawWheel(0);

/* ═══════════════════════════════════════════
   Q&A TÓMBOLA
═══════════════════════════════════════════ */

let qaPool  = [];
let qaUsed  = 0;
let qaState = 0; // 0=idle 1=question 2=answer
let qaIndex = -1;

function initQaPool() {
  qaPool = ALL_QA.map((_, i) => i);
  for (let i = qaPool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qaPool[i], qaPool[j]] = [qaPool[j], qaPool[i]];
  }
  qaUsed = 0; qaIndex = -1; qaState = 0;
}

initQaPool();

function updateProgress() {
  const pct = ALL_QA.length ? (qaUsed / ALL_QA.length) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${qaUsed} / ${ALL_QA.length}`;
}

function handleQaClick() {
  const card  = document.getElementById('qaCard');
  const label = document.getElementById('qaLabel');
  const text  = document.getElementById('qaText');
  const hint  = document.getElementById('qaHint');
  const num   = document.getElementById('qaNumber');

  card.classList.remove('flip-anim');
  void card.offsetWidth;
  card.classList.add('flip-anim');

  if (qaState === 0) {
    if (qaUsed >= ALL_QA.length) {
      label.className   = 'qa-state-label label-done';
      label.textContent = '¡Completado!';
      text.textContent  = '🎉 Se usaron todas las preguntas. Reinicia para volver a jugar.';
      hint.textContent  = '';
      num.textContent   = '';
      return;
    }
    qaIndex           = qaPool[qaUsed];
    label.className   = 'qa-state-label label-q';
    label.textContent = '❓ Pregunta';
    text.textContent  = ALL_QA[qaIndex].q;
    hint.textContent  = 'Haz clic para ver la respuesta';
    num.textContent   = `Pregunta ${qaUsed + 1} de ${ALL_QA.length}`;
    qaState = 1;

  } else if (qaState === 1) {
    label.className   = 'qa-state-label label-a';
    label.textContent = '✅ Respuesta';
    text.textContent  = ALL_QA[qaIndex].a;
    hint.textContent  = 'Haz clic para continuar con la siguiente';
    qaState = 2;

  } else {
    // Consume question and go to next
    qaUsed++;
    updateProgress();
    if (qaUsed >= ALL_QA.length) {
      label.className   = 'qa-state-label label-done';
      label.textContent = '¡Completado!';
      text.textContent  = '🎉 Se usaron todas las preguntas. Reinicia para volver a jugar.';
      hint.textContent  = '';
      num.textContent   = '';
      qaState = 0;
    } else {
      label.className   = 'qa-state-label label-idle';
      label.textContent = 'Siguiente pregunta';
      text.textContent  = 'Toca la tarjeta para obtener la siguiente pregunta';
      hint.textContent  = '';
      num.textContent   = '';
      qaState = 0;
    }
  }
}

function resetQa() {
  initQaPool();
  updateProgress();
  document.getElementById('qaLabel').className   = 'qa-state-label label-idle';
  document.getElementById('qaLabel').textContent = 'Haz clic para comenzar';
  document.getElementById('qaText').textContent  = 'Toca la tarjeta para obtener una pregunta aleatoria';
  document.getElementById('qaHint').textContent  = '';
  document.getElementById('qaNumber').textContent = '';
}

updateProgress();

/* ═══════════════════════════════════════════
   CONFETTI
═══════════════════════════════════════════ */

const confCanvas = document.getElementById('confetti-canvas');
const cctx       = confCanvas.getContext('2d');
let   pieces     = [];

function resizeConf() {
  confCanvas.width  = window.innerWidth;
  confCanvas.height = window.innerHeight;
}
resizeConf();
window.addEventListener('resize', resizeConf);

function launchConfetti() {
  pieces = [];
  const colors = ['#ff6b35','#7c3aed','#ffd60a','#06d6a0','#a855f7','#f97316','#10b981'];
  for (let i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * confCanvas.width, y: -10,
      vx: (Math.random() - 0.5) * 5,
      vy: 2 + Math.random() * 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 6 + Math.random() * 8,
      rot: Math.random() * 360,
      rspd: (Math.random() - 0.5) * 6,
      shape: Math.random() > 0.5 ? 'rect' : 'circle',
    });
  }
  animateConf();
}

function animateConf() {
  cctx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  pieces = pieces.filter(p => p.y < confCanvas.height + 20);
  if (!pieces.length) return;
  pieces.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.rspd;
    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot * Math.PI / 180);
    cctx.fillStyle = p.color;
    if (p.shape === 'rect') {
      cctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
    } else {
      cctx.beginPath();
      cctx.arc(0, 0, p.size/2, 0, 2*Math.PI);
      cctx.fill();
    }
    cctx.restore();
  });
  requestAnimationFrame(animateConf);
}
</script>
